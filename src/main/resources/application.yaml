server:
  port: 8080

spring:
  application:
    name: somshare
  profiles:
    active: dev

app:
  upload-dir: ./uploads

logging:
  level:
    root: INFO
    com.somshare: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
